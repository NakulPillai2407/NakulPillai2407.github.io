site_name: Holdout Research
site_description: Independent systematic strategy research lab. Hypothesis-driven trading strategies, tested out of sample, with failures published.
site_author: Nakul Pillai
site_url: https://nakulpillai2407.github.io/
repo_url: https://github.com/NakulPillai2407
repo_name: NakulPillai2407
copyright: Research project only. Nothing here is investment advice.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Strategies:
      - Overview: strategies/index.md
      - HR-001 Lead-Lag Centrality: strategies/lead-lag-centrality.md
      - HR-002 News Sentiment: strategies/news-sentiment.md
      - HR-003 Sector Residual Reversion: strategies/sector-residual-reversion.md
  - Methodology: methodology.md
  - Research Log: research-log.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
